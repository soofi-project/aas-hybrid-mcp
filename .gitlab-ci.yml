# Builds the container images and pushes them to this project's own registry.
# Four images from subfolders: mcp-server, submodel-templates-sync,
# embedding-service and kafka-connect-rag.
#
# The build job and the tag scheme (timestamp + snapshot on the default branch,
# tag name + stable on git tags) come from the shared template, see
# https://mrk40.dfki.de/administration/scripts
#
# The layer cache lives in the registry (:buildcache per image, USE_CACHE): without
# it every run re-downloads what the previous one fetched, for embedding-service
# torch plus the Docling models, per platform.

include:
  - project: administration/scripts
    ref: v1.2.0
    file: ci/gitlab/build-image.yml

stages:
  - test
  - build

# Unit tests of the embedding service. They run in the Dockerfile's `test` stage because
# the dependencies (docling, torch) only exist there; amd64 only, nothing is pushed, so no
# QEMU and no registry traffic. Runs on merge requests and on the default branch, before
# the multi-arch build.
test-embedding:
  extends: .dind
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docker build --target test embedding-service

build-image:
  extends: .build-image
  variables:
    IMAGE_SUFFIX: "/$SUBDIR"
    CONTEXT: "$SUBDIR"
    USE_CACHE: "true"
  parallel:
    matrix:
      # embedding-service is the long one of the four: torch CPU plus the
      # Docling models its Dockerfile downloads, per platform, under QEMU on
      # arm64. If the job ever needs a timeout, it is this entry, not the rest.
      - SUBDIR: [mcp-server, submodel-templates-sync, embedding-service, kafka-connect-rag]
